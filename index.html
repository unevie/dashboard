<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMAX PR팀 업무 대시보드</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
:root{--bg:#0c0e14;--sf:#161923;--sf2:#1c2030;--sf3:#232840;--bd:#2a3050;--tx:#e8eaf0;--tx2:#8b90a8;--ac:#5b8df9;--fire:#ff6b4a;--grn:#4ade80;--yel:#fbbf24;--pur:#a78bfa;--pink:#f472b6;--cyan:#22d3ee;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

.hd{position:sticky;top:0;z-index:100;background:rgba(12,14,20,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:0 28px}
.hd-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.logo-b{background:linear-gradient(135deg,var(--ac),var(--pur));padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700;color:#fff}
.hd-r{display:flex;align-items:center;gap:12px}
.hd-date{color:var(--tx2);font-size:12px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--grn)}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.rbtn{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.rbtn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}

.tw{background:rgba(12,14,20,.9);backdrop-filter:blur(20px);position:sticky;top:56px;z-index:99;border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:1px;max-width:1480px;margin:0 auto;padding:0 28px;overflow-x:auto}
.tab{padding:10px 14px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--tx2);border:none;border-bottom:2px solid transparent;background:none;transition:.2s;white-space:nowrap;font-family:inherit}
.tab:hover{color:var(--tx)}.tab.on{color:var(--ac);border-bottom-color:var(--ac)}

.ct{max-width:1480px;margin:0 auto;padding:20px 28px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.cd-h{padding:12px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd)}
.cd-b{padding:12px 16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.st{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px}
.st-l{font-size:11px;color:var(--tx2);font-weight:600;margin-bottom:5px}
.st-v{font-size:24px;font-weight:800;letter-spacing:-1px}
.st-s{font-size:10px;color:var(--tx2);margin-top:2px}

.tw2{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2);background:var(--sf2);border-bottom:1px solid var(--bd);position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid rgba(42,48,80,.4);vertical-align:top;line-height:1.5}
tr:hover td{background:rgba(91,141,249,.03)}
.bd{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:600;white-space:nowrap}
.bd-f{background:rgba(255,107,74,.15);color:var(--fire)}.bd-n{background:rgba(91,141,249,.12);color:var(--ac)}
.bd-p{background:rgba(74,222,128,.12);color:var(--grn)}.bd-r{background:rgba(251,191,36,.12);color:var(--yel)}
.bd-d{background:rgba(167,139,250,.12);color:var(--pur)}.bd-k{background:rgba(34,211,238,.1);color:var(--cyan)}
.bd-pk{background:rgba(244,114,182,.12);color:var(--pink)}.bd-pr{background:rgba(91,141,249,.15);color:var(--ac)}
.bd-sns{background:rgba(244,114,182,.12);color:var(--pink)}
.amt{text-align:right;font-variant-numeric:tabular-nums}

.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-h{text-align:center;font-size:10px;font-weight:700;color:var(--tx2);padding:6px}
.cal-h:first-child{color:var(--fire)}.cal-h:last-child{color:var(--ac)}
.cal-c{min-height:80px;padding:4px 5px;background:var(--sf2);border-radius:4px;font-size:10px}
.cal-c.today{border:1px solid var(--ac);background:rgba(91,141,249,.06)}
.cal-c.empty{background:transparent;min-height:auto}
.cal-dt{font-weight:700;font-size:11px;margin-bottom:2px;color:var(--tx2)}
.cal-c.today .cal-dt{color:var(--ac)}
.cal-ev{padding:1px 3px;margin-top:1px;border-radius:2px;font-size:9px;line-height:1.3}
.cal-ev.pr{background:rgba(91,141,249,.1);color:var(--ac)}
.cal-ev.pr-done{background:rgba(91,141,249,.06);color:rgba(91,141,249,.45);text-decoration:line-through}
.cal-ev.sns{background:rgba(244,114,182,.1);color:var(--pink)}
.cal-ev.sns-done{background:rgba(244,114,182,.06);color:rgba(244,114,182,.4);text-decoration:line-through}
.cal-ev.vac{background:rgba(148,163,184,.15);color:rgba(148,163,184,.9);font-weight:600}
.cal-ev.co{background:rgba(251,191,36,.1);color:var(--yel)}

.bb{height:5px;background:var(--sf3);border-radius:3px;overflow:hidden;width:100%}
.bf{height:100%;border-radius:3px;transition:width .6s}
.fb{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{padding:4px 11px;border-radius:14px;font-size:11px;font-weight:600;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:.2s;font-family:inherit}
.fbtn:hover,.fbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.si{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;color:var(--tx);font-size:12px;width:200px;outline:none;font-family:inherit}
.si::placeholder{color:var(--tx2)}.si:focus{border-color:var(--ac)}

.ni{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(42,48,80,.3)}
.ni:last-child{border-bottom:none}
.tp{display:none}.tp.on{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.stl{font-size:12px;font-weight:700;color:var(--tx2);margin:14px 0 8px}
.note-text{font-size:11px;color:var(--tx2);line-height:1.5;white-space:pre-wrap;max-height:80px;overflow-y:auto}
.lnk{color:var(--ac);text-decoration:none;font-size:11px}.lnk:hover{text-decoration:underline}

@media(max-width:1024px){.g2{grid-template-columns:1fr}.ct{padding:12px}}
@media(max-width:640px){.hd{padding:0 12px}.tabs{padding:0 12px}}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
</style>
</head>

const SST='background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;color:var(--tx);font-size:12px;font-family:inherit;outline:none;cursor:pointer;min-width:100px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 stroke=%27%238b90a8%27 fill=%27none%27 stroke-width=%271.5%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px';
function makeMultiDrop(containerId, label, items, renderFn){
  const wrap=document.getElementById(containerId);
  wrap.innerHTML=`<div style="position:relative;display:inline-block" id="${containerId}_w">
    <button style="${SST};min-width:120px;text-align:left" id="${containerId}_btn">${label} 전체</button>
    <div id="${containerId}_dd" style="display:none;position:absolute;top:100%;left:0;margin-top:4px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px;z-index:50;min-width:160px;max-height:240px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)"></div>
  </div>`;
  const btn=document.getElementById(containerId+'_btn'), dd=document.getElementById(containerId+'_dd');
  const sel=new Set();
  function drawDD(){
    dd.innerHTML=items.map(it=>`<label style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--tx);transition:.15s" onmouseover="this.style.background='var(--sf2)'" onmouseout="this.style.background='transparent'">
      <input type="checkbox" ${it==='전체'?(sel.size===0?'checked':''):(sel.has(it)?'checked':'')} data-v="${e(it)}" style="accent-color:var(--ac);cursor:pointer"> ${e(it)}
    </label>`).join('');
    dd.querySelectorAll('input').forEach(cb=>{
      cb.onchange=()=>{
        const v=cb.dataset.v;
        if(v==='전체'){sel.clear()}else{if(sel.has(v))sel.delete(v);else sel.add(v)}
        drawDD(); updateBtn(); renderFn();
      };
    });
  }
  function updateBtn(){
    if(sel.size===0) btn.textContent=label+' 전체';
    else if(sel.size===1) btn.textContent=[...sel][0];
    else btn.textContent=label+' '+sel.size+'개 선택';
  }
  btn.onclick=(ev)=>{ev.stopPropagation();dd.style.display=dd.style.display==='none'?'block':'none';drawDD()};
  document.addEventListener('click',ev=>{if(!wrap.contains(ev.target))dd.style.display='none'});
  return ()=>sel.size===0?null:[...sel];
}

(function(){

  <div id="suCal"></div>`;

  function render(){
    const mo=+document.getElementById('suMo').value;
    const moEv=ev.filter(x=>parseInt(x.month)===mo);
    const fd=new Date(2026,mo-1,1).getDay(),dim=new Date(2026,mo,0).getDate();
    const td=now.getDate(),tm=now.getMonth()+1;
    const eMap={};
    moEv.forEach(x=>{const d=parseInt(x.day);if(!isNaN(d)){if(!eMap[d])eMap[d]=[];eMap[d].push({day:d,content:x.content})}});
    let g=['일','월','화','수','목','금','토'].map(d=>`<div class="cal-h">${d}</div>`).join('');
    for(let i=0;i<fd;i++)g+='<div class="cal-c empty"></div>';
    for(let d=1;d<=dim;d++){
      const isT=d===td&&mo===tm,evts=eMap[d]||[];
      const isPast=mo<tm||(mo===tm&&d<td);
      g+=`<div class="cal-c${isT?' today':''}"><div class="cal-dt">${d}</div>${evts.map(c=>{
        const isPR=c.content.includes('[PR]');
        const cls=isPR?(isPast?'pr-done':'pr'):(isPast?'sns-done':'sns');
        return`<div class="cal-ev ${cls}">${c.content.replace('[PR] ','').replace('[SNS] ','')}</div>`;
      }).join('')}</div>`;
    }
    document.getElementById('suCal').innerHTML=`<div class="cd"><div class="cd-h">📅 ${mo}월 일정 (${moEv.length}건)</div><div class="cd-b"><div class="cal-g">${g}</div></div></div>`;
  }
  render();
  document.getElementById('suMo').addEventListener('change',render);
})();

// ===== 📅 일정_팀 =====
(function(){
  const el=document.getElementById('p-schedTeam'), ev=D.team_cal||[];
  const curM=now.getMonth()+1;
  const months=[...new Set(ev.map(x=>{const m=String(x.date).match(/(\d{4})[-\/](\d{1,2})[-\/]/);return m?+m[2]:null}).filter(Boolean))].sort((a,b)=>a-b);
  if(!months.includes(curM)&&months.length) months.push(curM);
  months.sort((a,b)=>a-b);

  // Parse vacation from notices: "이름 M/D - M/D" or "이름 M/D-M/D"
  function getVacations(){
    const vacs=[];
    const vacNotice=(window._notices||[]).find(n=>n.label&&n.label.includes('휴가'));
    if(!vacNotice) return vacs;
    vacNotice.items.forEach(item=>{
      // Match: name month/day - month/day (various separators)
      const m=item.match(/^(.+?)\s+(\d{1,2})\/(\d{1,2})\s*[-~]\s*(\d{1,2})\/(\d{1,2})/);
      if(m){
        vacs.push({name:m[1].trim(),sm:+m[2],sd:+m[3],em:+m[4],ed:+m[5]});
      }
    });
    return vacs;
  }

  el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <select id="stMo" style="${SST};min-width:90px">${months.map(m=>`<option value="${m}"${m===curM?' selected':''}>${m}월</option>`).join('')}</select>
    <span style="display:flex;gap:6px;margin-left:8px">
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2)"><span style="width:8px;height:8px;border-radius:2px;background:var(--ac);display:inline-block"></span>미팅/일정</span>
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2)"><span style="width:8px;height:8px;border-radius:2px;background:rgba(148,163,184,.5);display:inline-block"></span>휴가</span>
    </span>
  </div>
  <div id="stCal"></div>`;

  function render(){
    const mo=+document.getElementById('stMo').value;
    const fd=new Date(2026,mo-1,1).getDay(),dim=new Date(2026,mo,0).getDate();
    const td=now.getDate(),tm=now.getMonth()+1;
    const eMap={};
    ev.forEach(x=>{const m=String(x.date).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m&&+m[2]===mo){const d=+m[3];if(!eMap[d])eMap[d]=[];eMap[d].push({type:'team',text:x.events})}});

    // Inject vacation events
    const vacs=getVacations();
    vacs.forEach(v=>{
      // Handle range within same month or cross-month
      let startD=null,endD=null;
      if(v.sm===mo&&v.em===mo){startD=v.sd;endD=v.ed}
      else if(v.sm===mo){startD=v.sd;endD=dim}
      else if(v.em===mo){startD=1;endD=v.ed}
      else if(v.sm<mo&&v.em>mo){startD=1;endD=dim}
      if(startD!==null){
        for(let d=startD;d<=endD;d++){
          if(!eMap[d])eMap[d]=[];
          eMap[d].push({type:'vacation',text:v.name+' 휴가'});
        }
      }
    });

    let g=['일','월','화','수','목','금','토'].map(d=>`<div class="cal-h">${d}</div>`).join('');
    for(let i=0;i<fd;i++)g+='<div class="cal-c empty"></div>';
    for(let d=1;d<=dim;d++){
      const isT=d===td&&mo===tm,evts=eMap[d]||[];
      let evHtml=evts.map(ev=>{
        if(ev.type==='vacation') return`<div class="cal-ev vac">${ev.text}</div>`;
        return ev.text.split('\n').map(l=>`<div class="cal-ev pr">${l.replace('🔹','')}</div>`).join('');
      }).join('');
      g+=`<div class="cal-c${isT?' today':''}"><div class="cal-dt">${d}</div>${evHtml}</div>`;
    }
    document.getElementById('stCal').innerHTML=`<div class="cd"><div class="cd-h">📅 2026년 ${mo}월 팀 일정</div><div class="cd-b"><div class="cal-g">${g}</div></div></div>`;
  }
  render();
  document.getElementById('stMo').addEventListener('change',render);
})();

// ===== 📒 전사일정 =====
(function(){
  const el=document.getElementById('p-comCal'), cc=D.company_cal||[];
  const curM=now.getMonth()+1;
  const months=[...new Set(cc.map(x=>{const m=x.month;return m?parseInt(m):null}).filter(Boolean))].sort((a,b)=>a-b);
  if(!months.includes(curM)&&months.length) months.push(curM);
  months.sort((a,b)=>a-b);

  el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <select id="ccMo" style="${SST};min-width:90px">${months.map(m=>`<option value="${m}"${m===curM?' selected':''}>${m}월</option>`).join('')}</select>
  </div>
  <div id="ccCal"></div>`;

  function render(){
    const mo=+document.getElementById('ccMo').value;
    const moItems=cc.filter(x=>parseInt(x.month)===mo);
    const y=2026,fd=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate();
    const eMap={};
    moItems.forEach(x=>{
      const mt=String(x.date).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if(mt){const d=+mt[3];if(!eMap[d])eMap[d]=[];eMap[d]=eMap[d].concat(x.events)}
      else{const n=parseFloat(x.date);if(!isNaN(n)&&n>0&&n<=31){if(!eMap[n])eMap[n]=[];eMap[n]=eMap[n].concat(x.events)}}
    });
    let g=['일','월','화','수','목','금','토'].map(d=>`<div class="cal-h">${d}</div>`).join('');
    for(let i=0;i<fd;i++)g+='<div class="cal-c empty"></div>';
    for(let d=1;d<=dim;d++){
      const isT=d===now.getDate()&&mo===now.getMonth()+1;
      const evts=eMap[d]||[];
      g+=`<div class="cal-c${isT?' today':''}"><div class="cal-dt">${d}</div>${evts.map(ev=>`<div class="cal-ev pr">${e(ev)}</div>`).join('')}</div>`;
    }
    document.getElementById('ccCal').innerHTML=`<div class="cd"><div class="cd-h">📒 전사일정 — ${mo}월</div><div class="cd-b"><div class="cal-g">${g}</div></div></div>`;
  }
  render();
  document.getElementById('ccMo').addEventListener('change',render);
})();


// ============================================================
//  🔄 Google Sheets 실시간 동기화 (최신 fetch API 적용)
// ============================================================
(function(){
  var SID='1iuJug0h2OAhNwCjLjXrgfPXbTEKNgkmEjoeEimi9zxQ';
  var SHEETS={
    today:'2019833545',outing:'1082142237',taskProg:'565443842',
    taskDone:'2097791101',schedUp:'391932140',schedTeam:'139798086',
    clipping:'1515082375',budget:'2081056963',monthly:'446415781',
    pr:'745319363',logo:'1482945022',comCal:'1605555821'
  };
  var AUTO_MS=5*60*1000;
  var st=document.getElementById('liveS');
  
  // JSONP 대신 표준 fetch API를 사용하여 데이터 호출
  async function fetchSheetData(key, gid) {
    const url = `https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json&gid=${gid}`;
    try {
      const response = await fetch(url);
      const text = await response.text();
      
      // 구글 응답 텍스트에서 순수 JSON 부분만 추출
      const jsonString = text.substring(47).slice(0, -2);
      const json = JSON.parse(jsonString);

      // 기존 코드가 예상하는 2차원 배열 형태로 변환
      const cols = json.table.cols.length;
      const rows = json.table.rows.map(row => {
        const r = [];
        for (let i = 0; i < cols; i++) {
          const cell = row.c && row.c[i];
          if (!cell) r.push('');
          else if (cell.f) r.push(cell.f);
          else if (cell.v != null) r.push(String(cell.v));
          else r.push('');
        }
        return r;
      });
      const hdr = json.table.cols.map(c => c.label || '');
      return [hdr].concat(rows);
    } catch (error) {
      console.warn(`[${key}] 데이터 호출 실패:`, error);
      return null;
    }
  }

  // 데이터 파싱 함수들은 기존 코드 그대로 유지합니다. (pToday, pTasks 등...)
  function s(v){return v==null?'':String(v).trim()}
  function n(v){var x=parseFloat(v);return isNaN(x)?null:x}

  // (여기에 기존 pToday, pTasks, pTeamCal, pSchedUp, pClipping, pBudget, pMonthly, pPR, pComCal 함수가 그대로 있어야 합니다!)

  async function syncAll(){
    st.textContent='동기화중...';st.style.color='var(--yel)';
    try{
      var keys=Object.keys(SHEETS);
      var promises=keys.map(function(k){return fetchSheetData(k,SHEETS[k])});
      var results=await Promise.all(promises);
      var ok=0;
      
      keys.forEach(function(k,i){
        var r=results[i];if(!r)return;ok++;
        try{
          if(k==='today')pToday(r);
          else if(k==='taskProg')D.tasks_progress=pTasks(r);
          else if(k==='taskDone')D.tasks_done=pTasks(r);
          else if(k==='schedTeam'){var ev=pTeamCal(r);if(ev.length)D.team_cal=ev}
          else if(k==='schedUp'){var ev=pSchedUp(r);if(ev.length)D.schedule_events=ev}
          else if(k==='clipping'){var c=pClipping(r);if(c.length)D.clipping=c}
          else if(k==='budget'){var b=pBudget(r);if(b.length)D.budget_rows=b}
          else if(k==='monthly'){var m=pMonthly(r);if(m.length)D.monthly=m}
          else if(k==='pr'){var p=pPR(r);if(p.length)D.pr_list=p}
          else if(k==='comCal'){var c=pComCal(r);if(c.length)D.company_cal=c}
        }catch(e){console.warn('Parse ['+k+']:',e)}
      });
      
      if(ok===0){st.textContent='연결실패';st.style.color='var(--fire)';return}
      console.log('📊 동기화 완료: '+ok+'/'+keys.length+' 시트');
      st.textContent='LIVE';st.style.color='var(--grn)';
      st.title=ok+'/'+keys.length+' ('+new Date().toLocaleTimeString('ko')+')';
      try{sessionStorage.setItem('cosmax_live',JSON.stringify(D))}catch(e){}
      
      // 첫 동기화 시 화면을 새로 그리기 위해 새로고침 (주의: 무한 루프 방지 처리 필요)
      if(!window._alreadySynced) {
          window._alreadySynced = true;
          // UI 렌더링 함수들을 여기서 다시 호출하는 것이 좋으나, 임시로 리로드
          // location.reload(); 
      }
    }catch(e){console.error('Sync err:',e);st.textContent='오류';st.style.color='var(--fire)'}
  }

  var rbtn=document.querySelector('.rbtn');
  if(rbtn)rbtn.onclick=function(){sessionStorage.removeItem('cosmax_live');syncAll()};
  if(!_cached){setTimeout(syncAll,2000)}
  else{st.textContent='LIVE';st.style.color='var(--grn)';st.title='캐시'}
  if(AUTO_MS>0)setInterval(function(){sessionStorage.removeItem('cosmax_live');syncAll()},AUTO_MS);
})();
</script>
