<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMAX PR팀 업무 대시보드</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
:root{--bg:#0c0e14;--sf:#161923;--sf2:#1c2030;--sf3:#232840;--bd:#2a3050;--tx:#e8eaf0;--tx2:#8b90a8;--ac:#5b8df9;--fire:#ff6b4a;--grn:#4ade80;--yel:#fbbf24;--pur:#a78bfa;--pink:#f472b6;--cyan:#22d3ee;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

.hd{position:sticky;top:0;z-index:100;background:rgba(12,14,20,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:0 28px}
.hd-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.logo-b{background:linear-gradient(135deg,var(--ac),var(--pur));padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700;color:#fff}
.hd-r{display:flex;align-items:center;gap:12px}
.hd-date{color:var(--tx2);font-size:12px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--grn)}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.rbtn{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.rbtn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}

.tw{background:rgba(12,14,20,.9);backdrop-filter:blur(20px);position:sticky;top:56px;z-index:99;border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:1px;max-width:1480px;margin:0 auto;padding:0 28px;overflow-x:auto}
.tab{padding:10px 14px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--tx2);border:none;border-bottom:2px solid transparent;background:none;transition:.2s;white-space:nowrap;font-family:inherit}
.tab:hover{color:var(--tx)}.tab.on{color:var(--ac);border-bottom-color:var(--ac)}

.ct{max-width:1480px;margin:0 auto;padding:20px 28px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.cd-h{padding:12px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd)}
.cd-b{padding:12px 16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.st{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px}
.st-l{font-size:11px;color:var(--tx2);font-weight:600;margin-bottom:5px}
.st-v{font-size:24px;font-weight:800;letter-spacing:-1px}
.st-s{font-size:10px;color:var(--tx2);margin-top:2px}

.tw2{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2);background:var(--sf2);border-bottom:1px solid var(--bd);position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid rgba(42,48,80,.4);vertical-align:top;line-height:1.5}
tr:hover td{background:rgba(91,141,249,.03)}
.bd{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:600;white-space:nowrap}
.bd-f{background:rgba(255,107,74,.15);color:var(--fire)}.bd-n{background:rgba(91,141,249,.12);color:var(--ac)}
.bd-p{background:rgba(74,222,128,.12);color:var(--grn)}.bd-r{background:rgba(251,191,36,.12);color:var(--yel)}
.bd-d{background:rgba(167,139,250,.12);color:var(--pur)}.bd-k{background:rgba(34,211,238,.1);color:var(--cyan)}
.bd-pk{background:rgba(244,114,182,.12);color:var(--pink)}.bd-pr{background:rgba(91,141,249,.15);color:var(--ac)}
.bd-sns{background:rgba(244,114,182,.12);color:var(--pink)}
.amt{text-align:right;font-variant-numeric:tabular-nums}

.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-h{text-align:center;font-size:10px;font-weight:700;color:var(--tx2);padding:6px}
.cal-h:first-child{color:var(--fire)}.cal-h:last-child{color:var(--ac)}
.cal-c{min-height:80px;padding:4px 5px;background:var(--sf2);border-radius:4px;font-size:10px}
.cal-c.today{border:1px solid var(--ac);background:rgba(91,141,249,.06)}
.cal-c.empty{background:transparent;min-height:auto}
.cal-dt{font-weight:700;font-size:11px;margin-bottom:2px;color:var(--tx2)}
.cal-c.today .cal-dt{color:var(--ac)}
.cal-ev{padding:1px 3px;margin-top:1px;border-radius:2px;font-size:9px;line-height:1.3}
.cal-ev.pr{background:rgba(91,141,249,.1);color:var(--ac)}
.cal-ev.pr-done{background:rgba(91,141,249,.06);color:rgba(91,141,249,.45);text-decoration:line-through}
.cal-ev.sns{background:rgba(244,114,182,.1);color:var(--pink)}
.cal-ev.sns-done{background:rgba(244,114,182,.06);color:rgba(244,114,182,.4);text-decoration:line-through}
.cal-ev.vac{background:rgba(148,163,184,.15);color:rgba(148,163,184,.9);font-weight:600}
.cal-ev.co{background:rgba(251,191,36,.1);color:var(--yel)}

.bb{height:5px;background:var(--sf3);border-radius:3px;overflow:hidden;width:100%}
.bf{height:100%;border-radius:3px;transition:width .6s}
.fb{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{padding:4px 11px;border-radius:14px;font-size:11px;font-weight:600;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:.2s;font-family:inherit}
.fbtn:hover,.fbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.si{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;color:var(--tx);font-size:12px;width:200px;outline:none;font-family:inherit}
.si::placeholder{color:var(--tx2)}.si:focus{border-color:var(--ac)}

.ni{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(42,48,80,.3)}
.ni:last-child{border-bottom:none}
.tp{display:none}.tp.on{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.stl{font-size:12px;font-weight:700;color:var(--tx2);margin:14px 0 8px}
.note-text{font-size:11px;color:var(--tx2);line-height:1.5;white-space:pre-wrap;max-height:80px;overflow-y:auto}
.lnk{color:var(--ac);text-decoration:none;font-size:11px}.lnk:hover{text-decoration:underline}

@media(max-width:1024px){.g2{grid-template-columns:1fr}.ct{padding:12px}}
@media(max-width:640px){.hd{padding:0 12px}.tabs{padding:0 12px}}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.bd-cat1{background:rgba(91,141,249,.15);color:var(--ac)}
.bd-cat2{background:rgba(244,114,182,.15);color:var(--pink)}
.bd-cat3{background:rgba(251,191,36,.13);color:var(--yel)}
.more-btn{background:none;border:none;color:var(--ac);font-size:10px;cursor:pointer;padding:0 2px;font-family:inherit;text-decoration:underline}
.more-btn:hover{color:var(--pur)}
.cal-ev.pr-sched{background:rgba(91,141,249,.12);color:var(--ac)}
.cal-ev.sns-sched{background:rgba(244,114,182,.12);color:var(--pink)}
.cal-ev.forum{background:rgba(251,191,36,.13);color:var(--yel)}
.cal-ev.biz-meeting{background:rgba(34,211,238,.1);color:var(--cyan)}
.st.filter-able{cursor:pointer;transition:.15s;user-select:none}
.st.filter-able:hover{border-color:var(--ac)}
.st.filter-on{border:1px solid var(--ac)!important;box-shadow:0 0 0 2px rgba(91,141,249,.2)}
.inv-done{text-decoration:line-through;opacity:.45}
.bg-dd-item{padding:5px 8px;cursor:pointer;font-size:12px;color:var(--tx);border-radius:4px;transition:.1s}
.nm-lbl{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--tx)}
.nm-lbl:hover{background:var(--sf2)}
.cal-ev.meeting-item{background:rgba(99,102,241,.18);color:#818cf8;font-weight:500}
</style>
</head>

function bd(t,x){return`<span class="bd bd-${t}">${x}</span>`}
function prB(p){if(!p)return'';if(p.includes('중요'))return bd('f','🔥중요');if(p.includes('긴급'))return bd('pk','🚨긴급');return bd('n','⭐️보통')}
function stB(s){if(!s)return'';if(s.includes('진행'))return bd('p','진행중');if(s.includes('완료'))return bd('d','완료');return bd('r','예정/준비')}
function fD(d){
  if(!d)return'-';
  var s=String(d).trim();
  if(!s||s==='-')return'-';
  // ISO datetime: 2026-04-29T15:00:00.000Z
  var m=s.match(/(\d{4})-(\d{2})-(\d{2})T/);
  if(m)return +m[2]+'/'+ +m[3];
  // Standard date: 2026-04-29 or 2026.4.29 or 2026/4/29
  m=s.match(/(\d{4})[-\/.]\s*(\d{1,2})[-\/.]\s*(\d{1,2})/);
  if(m)return +m[2]+'/'+ +m[3];
  return s;
}
// Normalize ISO date to YYYY-MM-DD for filtering/display
function nD(d){
  if(!d)return'';
  var sv=String(d).trim();
  // 순수 YYYY-MM-DD (시간 없음) → 그대로 사용
  if(/^\d{4}-\d{2}-\d{2}$/.test(sv))return sv;
  // ISO UTC 타임스탬프: "2026-04-09T15:00:00.000Z"
  // Apps Script가 KST 날짜를 UTC ISO로 직렬화 → KST 자정 = UTC 전날 15:00
  // → UTC + 9시간(KST 보정) 후 날짜 추출
  if(sv.indexOf('T')>0){
    var dt=new Date(sv);
    if(!isNaN(dt.getTime())){
      var kst=new Date(dt.getTime()+9*3600*1000);
      return kst.getUTCFullYear()+'-'+
        String(kst.getUTCMonth()+1).padStart(2,'0')+'-'+
        String(kst.getUTCDate()).padStart(2,'0');
    }
  }
  // 기타 형식: 2026.4.1 or 2026/4/1
  var m=sv.match(/(\d{4})[-\/.]\s*(\d{1,2})[-\/.]\s*(\d{1,2})/);
  if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  return sv;
}
function fA(v){if(!v||v==='-')return'-';const n=parseFloat(v);return isNaN(n)?v:n.toLocaleString()}
function e(s){return s?String(s).replace(/</g,'&lt;'):''}

const SST='background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;color:var(--tx);font-size:12px;font-family:inherit;outline:none;cursor:pointer;min-width:100px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 stroke=%27%238b90a8%27 fill=%27none%27 stroke-width=%271.5%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px';
function makeMultiDrop(containerId, label, items, renderFn){
  const wrap=document.getElementById(containerId);
  wrap.innerHTML=`<div style="position:relative;display:inline-block" id="${containerId}_w">
    <button style="${SST};min-width:120px;text-align:left" id="${containerId}_btn">${label} 전체</button>
    <div id="${containerId}_dd" style="display:none;position:absolute;top:100%;left:0;margin-top:4px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px;z-index:50;min-width:160px;max-height:240px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)"></div>
  </div>`;
  const btn=document.getElementById(containerId+'_btn'), dd=document.getElementById(containerId+'_dd');
  const sel=new Set();
  function drawDD(){
    dd.innerHTML=items.map(it=>`<label style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--tx);transition:.15s" onmouseover="this.style.background='var(--sf2)'" onmouseout="this.style.background='transparent'">
      <input type="checkbox" ${it==='전체'?(sel.size===0?'checked':''):(sel.has(it)?'checked':'')} data-v="${e(it)}" style="accent-color:var(--ac);cursor:pointer"> ${e(it)}
    </label>`).join('');
    dd.querySelectorAll('input').forEach(cb=>{
      cb.onchange=()=>{
        const v=cb.dataset.v;
        if(v==='전체'){sel.clear()}else{if(sel.has(v))sel.delete(v);else sel.add(v)}
        drawDD(); updateBtn(); renderFn();
      };
    });
  }
  function updateBtn(){
    if(sel.size===0) btn.textContent=label+' 전체';
    else if(sel.size===1) btn.textContent=[...sel][0];
    else btn.textContent=label+' '+sel.size+'개 선택';
  }
  btn.onclick=(ev)=>{ev.stopPropagation();dd.style.display=dd.style.display==='none'?'block':'none';drawDD()};
  document.addEventListener('click',ev=>{if(!wrap.contains(ev.target))dd.style.display='none'});
  return ()=>sel.size===0?null:[...sel];
}

    return`<span id="nt_${uid}_s">${e(note.substring(0,NOTE_MAX))}… <button class="more-btn" onclick="document.getElementById('nt_${uid}_s').style.display='none';document.getElementById('nt_${uid}_f').style.display='inline'">더보기</button></span><span id="nt_${uid}_f" style="display:none">${e(note)} <button class="more-btn" onclick="document.getElementById('nt_${uid}_f').style.display='none';document.getElementById('nt_${uid}_s').style.display='inline'">접기</button></span>`;

      <th style="padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">내용</th>
      <th style="padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2);width:55px">중요도</th>
      <th style="padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2);width:70px">종료일</th>

    </tr></thead>
    <tbody id="tdB"></tbody></table></div></div>`;

    btn.onclick=ev=>{ev.stopPropagation();const s=dd.style.display!=='none';dd.style.display=s?'none':'block';if(!s)draw();};
    document.addEventListener('click',ev=>{if(!wrap.contains(ev.target))dd.style.display='none';});
    getDoneMonths=()=>sel.size===0?null:[...sel];
  })();

  getCats=makeMultiDrop('tdCatW','구분',cats,render);
  getPers=makeMultiDrop('tdPerW','담당자',persons,render);
  render();
  document.getElementById('tdS').addEventListener('input',render);

(function(){

    if(h.length!==6)return '';
    var r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);

      <tr style="background:var(--sf3)"><th style="border-bottom:2px solid var(--bd)"></th>${mb.map(()=>`<th style="text-align:center;width:120px;color:var(--tx2);font-size:10px;font-weight:600;padding:5px;border-bottom:2px solid var(--bd)">일정</th><th style="text-align:center;width:80px;color:var(--tx2);font-size:10px;font-weight:600;padding:5px;border-bottom:2px solid var(--bd)">장소</th>`).join('')}</tr>
    </thead>

      ${[0,1,2,3].map(i=>{

        const hasData=sch||pl;
        const bgS=bg?bgStyle(bg):(hasData?FALLBACK:'');
        const schStyle='text-align:center;word-break:keep-all;word-wrap:break-word;'+(bgS?(bgS+';font-weight:600'):'');
        const plStyle='text-align:center;word-break:keep-all;word-wrap:break-word;'+(bgS?bgS:'color:var(--tx2)');
        return `<td style="${schStyle}">${e(sch)||''}</td><td style="${plStyle}">${e(pl)||''}</td>`;
      }).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
})();

(function(){
  const el=document.getElementById('p-schedUp'), ev=D.schedule_events||[];
  const curM=now.getMonth()+1;
  const months=[...new Set(ev.map(x=>{const m=x.month;return m?parseInt(m):null}).filter(Boolean))].sort((a,b)=>a-b);
  if(!months.includes(curM)&&months.length) months.push(curM);
  months.sort((a,b)=>a-b);

  // 날짜 기반 완료/예정 판별: 이벤트 날짜가 오늘 이전이면 완료, 이후면 예정
  function isDone(month, day){
    const y=2026, evDate=new Date(y, month-1, parseInt(day));
    const todayDate=new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return evDate < todayDate;
  }

  el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <select id="suMo" style="${SST};min-width:90px">${months.map(m=>`<option value="${m}"${m===curM?' selected':''}>${m}월</option>`).join('')}</select>
    <span style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)">
        <span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:rgba(91,141,249,.18);border-left:2px solid var(--ac)"></span>[PR] 예정</span>
      <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)">
        <span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:rgba(91,141,249,.07);border-left:2px solid rgba(91,141,249,.3)"></span>[PR] 완료</span>
      <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)">
        <span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:rgba(244,114,182,.18);border-left:2px solid var(--pink)"></span>[SNS] 예정</span>
      <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)">
        <span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:rgba(244,114,182,.07);border-left:2px solid rgba(244,114,182,.3)"></span>[SNS] 완료</span>
    </span>
  </div>
  <div id="suCal"></div>`;

  function render(){
    const mo=+document.getElementById('suMo').value;
    const moEv=ev.filter(x=>parseInt(x.month)===mo);
    const fd=new Date(2026,mo-1,1).getDay(),dim=new Date(2026,mo,0).getDate();
    const td=now.getDate(),tm=now.getMonth()+1;
    const eMap={};
    moEv.forEach(x=>{const d=parseInt(x.day);if(!isNaN(d)){if(!eMap[d])eMap[d]=[];eMap[d].push({day:d,content:x.content,done:isDone(mo,d)})}});
    let g=['일','월','화','수','목','금','토'].map(d=>`<div class="cal-h">${d}</div>`).join('');
    for(let i=0;i<fd;i++)g+='<div class="cal-c empty"></div>';
    for(let d=1;d<=dim;d++){
      const isT=d===td&&mo===tm,evts=eMap[d]||[];
      g+=`<div class="cal-c${isT?' today':''}"><div class="cal-dt" style="font-size:13px">${d}</div>${evts.map(c=>{
        const isPR=c.content.includes('[PR]');
        const done=c.done;
        const label=c.content.replace('[PR] ','').replace('[SNS] ','');
        if(done){
          // 완료: 체크 아이콘 + 흐린 배경, 텍스트 색 유지하되 투명도 낮춤
          const doneStyle=isPR
            ?'background:rgba(91,141,249,.15);color:rgba(91,141,249,.7);border-left:2px solid rgba(91,141,249,.6)'
            :'background:rgba(244,114,182,.15);color:rgba(244,114,182,.7);border-left:2px solid rgba(244,114,182,.6)';
          return '<div class="cal-ev" style="font-size:11px;padding:2px 4px;'+doneStyle+'">✓ '+label+'</div>';
        }else{
          // 예정: 밝은 색상 강조

            :'background:rgba(244,114,182,.18);color:var(--pink);font-weight:600;border-left:2px solid var(--pink)';
          return '<div class="cal-ev" style="font-size:11px;padding:2px 4px;'+schedStyle+'">→ '+label+'</div>';

// ===== 📅 일정_팀 =====
(function(){
  const el=document.getElementById('p-schedTeam'), ev=D.team_cal||[];
  const curM=now.getMonth()+1;

  // 업무미팅 카테고리
  const MEET_CATS=['언론미팅','콘텐츠미팅','취재응대'];
  const CUST_CATS=['고객사미팅'];
  const FORUM_CATS=['포럼/행사'];
  const VAC_CATS=['휴가/교육'];

  function getTaskEvents(mo){
    // 업무_진행 + 업무_완료에서 당월 종료일 업무 모두 가져오기
    const allTasks=[...(D.tasks_progress||[]),...(D.tasks_done||[])];
    const eMap={};
    allTasks.forEach(t=>{
      const dl=String(t.deadline||'');
      const dm=dl.match(/(\d{4})[-.\s]*(\d{1,2})[-.\s]*(\d{1,2})/);
      if(!dm||+dm[2]!==mo)return;
      const d=+dm[3];
      if(!eMap[d])eMap[d]=[];
      const cat=t.category||'';
      const label=(t.media&&t.media!=='미정'?t.media:t.content||'').substring(0,10);
      const person=t.person?'('+t.person+')':'';
      let type='other';
      if(MEET_CATS.includes(cat))type='meeting';
      else if(CUST_CATS.includes(cat))type='customer';
      else if(FORUM_CATS.includes(cat))type='forum';
      else if(VAC_CATS.includes(cat)||cat.includes('휴가'))type='vacation';
      eMap[d].push({type,text:label+person});
    });
    return eMap;
  }

  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div style="font-size:13px;font-weight:700;color:var(--tx)">📅 ${curM}월 일정</div>
    <span style="display:flex;gap:10px;flex-wrap:wrap">
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2)"><span style="width:8px;height:8px;border-radius:2px;background:rgba(99,102,241,.5);display:inline-block"></span>업무미팅</span>
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2)"><span style="width:8px;height:8px;border-radius:2px;background:var(--yel);display:inline-block"></span>포럼/행사</span>
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2)"><span style="width:8px;height:8px;border-radius:2px;background:rgba(148,163,184,.5);display:inline-block"></span>휴가/교육</span>
    </span>
  </div>
  <div id="stCal"></div>`;

  function render(){
    const mo=curM;
    const fd=new Date(2026,mo-1,1).getDay(),dim=new Date(2026,mo,0).getDate();
    const td=now.getDate(),tm=now.getMonth()+1;
    const eMap={};

    // team_cal (구글시트 일정_팀) 이벤트
    ev.forEach(x=>{
      const m=String(x.date).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if(m&&+m[2]===mo){
        const d=+m[3];if(!eMap[d])eMap[d]=[];
        // events가 문자열이면 split
        const rawEvts=String(x.events||'');const evts=Array.isArray(x.events)?x.events:rawEvts.split('\n').filter(Boolean);
        evts.forEach(ev2=>eMap[d].push({type:'team',text:ev2.replace('🔹','')}));
      }
    });

    // 업무탭 이벤트 (4가지 컬러)
    const taskMap=getTaskEvents(mo);
    Object.keys(taskMap).forEach(d=>{
      const di=+d;
      if(!eMap[di])eMap[di]=[];
      taskMap[di].forEach(ev2=>eMap[di].push(ev2));
    });

    let g=['일','월','화','수','목','금','토'].map(d=>`<div class="cal-h">${d}</div>`).join('');
    for(let i=0;i<fd;i++)g+='<div class="cal-c empty"></div>';
    for(let d=1;d<=dim;d++){
      const isT=d===td&&mo===tm;
      const evts=eMap[d]||[];
      let evHtml=evts.map(ev2=>{
        if(ev2.type==='vacation') return`<div style="font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;background:rgba(148,163,184,.15);color:rgba(200,210,230,.85);border-left:3px solid rgba(148,163,184,.8);font-weight:500">${e(ev2.text)}</div>`;
        if(ev2.type==='forum') return`<div style="font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;background:rgba(234,179,8,.15);color:var(--yel);border-left:3px solid var(--yel);font-weight:500">${e(ev2.text)}</div>`;
        // 고객사미팅: 초록
        if(ev2.type==='customer') return`<div style="font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;background:rgba(34,197,94,.15);color:rgba(74,222,128,.95);border-left:3px solid rgba(34,197,94,.7);font-weight:500">${e(ev2.text)}</div>`;
        if(ev2.type==='meeting') return`<div style="font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;background:rgba(99,102,241,.18);color:#818cf8;border-left:3px solid rgba(99,102,241,.85);font-weight:500">${e(ev2.text)}</div>`;
        if(ev2.type==='other') return`<div style="font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;background:rgba(34,197,94,.12);color:rgba(74,222,128,.9);border-left:3px solid rgba(34,197,94,.6);font-weight:500">${e(ev2.text)}</div>`;
        return`<div style="font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;background:rgba(99,102,241,.15);color:#818cf8;border-left:3px solid rgba(99,102,241,.8);font-weight:500">${e(ev2.text)}</div>`;
      }).join('');
      g+=`<div class="cal-c${isT?' today':''}"><div class="cal-dt" style="font-size:12px">${d}</div>${evHtml}</div>`;
    }
    document.getElementById('stCal').innerHTML=`<div class="cd"><div class="cd-b"><div class="cal-g">${g}</div></div></div>`;
  }
  render();
})();

// ===== 💰 예산현황 =====
(function(){

  const total=rows.find(r=>r.isTotal);
  const fNI=v=>{if(v===null||v===undefined)return'-';const n=parseFloat(v);return isNaN(n)?'-':Math.round(n).toLocaleString()};

  const fND=v=>{if(v===null||v===undefined)return'-';const n=parseFloat(v);return isNaN(n)?'-':n.toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1})};
  const MAIN_TYPES=['일간지','경제지','통신/방송','온라인','전문지'];

  const sampleItem=rows.find(r=>r.monthly&&Object.keys(r.monthly).length>0);
  const months=sampleItem?Object.keys(sampleItem.monthly).sort((a,b)=>parseInt(a)-parseInt(b)):[];
  // 1월~12월 전체 생성 (데이터 없어도 선택 가능)
  const allMonths=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const typeList=[...new Set(rows.filter(r=>!r.isSub&&!r.isTotal&&!r.isSingle&&MAIN_TYPES.includes(r.type)).map(r=>r.type).filter(Boolean))];
  const nameList=[...new Set(rows.filter(r=>!r.isSub&&!r.isTotal&&r.name&&MAIN_TYPES.includes(r.type)).map(r=>r.name))].sort((a,b)=>{
    const isKo=s=>/^[가-힣]/.test(s),isNum=s=>/^[0-9]/.test(s);
    const rank=s=>isKo(s)?0:isNum(s)?1:2;
    const ra=rank(a),rb=rank(b);
    if(ra!==rb)return ra-rb;
    return a.localeCompare(b,'ko');
  });

  // 디폴트: 이전월
  const curMon=new Date().getMonth()+1;
  const prevMonStr=(curMon>1?(curMon-1):12)+'월';
  let selMonth=prevMonStr;   // 이전월 기본값
  let viewMode='cum';        // 'cum'=누계(선택월까지합산), 'mon'=당월(해당월만)
  // 그룹 펼침 상태 (true=펼침)
  const groupOpen={'일간지':true,'경제지':true,'통신/방송':true,'온라인':true,'전문지':true,'SNS채널':true};
  let getTypes,getNames;
  let nameSearch='';

  // 선택월(N월)까지의 monthly 누적 합산
  function cumSum(row, mo){
    if(!mo||!row.monthly)return{v26:null,v25:null};
    const moNum=parseInt(mo);
    let s26=0,s25=0,has=false;
    for(var k in row.monthly){
      const km=parseInt(k);
      if(!isNaN(km)&&km<=moNum){
        const mv2=row.monthly[k];
        s26+=(parseFloat(mv2.v26)||0);
        s25+=(parseFloat(mv2.v25)||0);
        has=true;
      }
    }
    return has?{v26:s26,v25:s25}:{v26:null,v25:null};
  }

  function getDisplay(){
    const t=total||{};
    const tA=parseFloat(t.a26)||0;
    if(selMonth){
      if(viewMode==='mon'){
        // 당월: 해당 월만
        const m=t.monthly&&t.monthly[selMonth]||{};
        const tS=parseFloat(m.v26)||0;
        const tS25=parseFloat(m.v25)||0;
        const rate=tA>0?(tS/tA*100).toFixed(1):0;
        return{tA,tS,tS25,rate,execLabel:"'26 당월 집행",rem3Label:"'25 당월 집행",remVal:tS25};
      } else {
        // 누계: 1월~선택월 합산
        const cs=cumSum(t,selMonth);
        const tS=cs.v26||0;
        const tS25=cs.v25||0;
        const rate=tA>0?(tS/tA*100).toFixed(1):0;
        return{tA,tS,tS25,rate,execLabel:selMonth+' 누계 집행',rem3Label:"'25 집행 누계",remVal:tS25};
      }
    }
    const tS=parseFloat(t.s26)||0;
    const rate=tA>0?(tS/tA*100).toFixed(1):0;
    return{tA,tS,tS25:null,rate,execLabel:"'26 집행 누계",rem3Label:"'26 잔여 예산",remVal:tA-tS};
  }

  el.innerHTML=`<div style="display:flex;gap:12px;margin-bottom:14px;align-items:stretch">
    <div class="st filter-able" id="bgMoBox" style="padding:10px 16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;cursor:pointer;min-width:60px">
      <div id="bgMoVal" style="font-size:18px;font-weight:800;letter-spacing:-0.5px;color:var(--cyan)"></div>
      <div id="bgMo_dd" style="display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px;z-index:60;min-width:80px;box-shadow:0 8px 24px rgba(0,0,0,.5)"></div>
    </div>
    <div class="st" style="flex:1"><div class="st-l">'26 연간 예산</div>

      <div style="display:flex;align-items:baseline;gap:5px;margin-top:4px;flex-wrap:wrap">
        <span class="st-v" style="color:var(--grn)" id="bgExecV">-</span>
        <span id="bgExecS" style="font-size:12px;font-weight:500"></span>
      </div>

    <div class="st" style="flex:1"><div class="st-l" id="bgRem3L">'26 잔여 예산</div>
      <div style="display:flex;align-items:baseline;gap:5px;margin-top:4px">
        <span class="st-v" style="color:var(--yel)" id="bgRemV">-</span>
        <span id="bgRemUnit" style="font-size:12px;font-weight:500">백만원</span>
      </div>
    </div>
  </div>
  <div class="cd">
    <div class="cd-h" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span>📊 매체별 연간 예산 현황 <span style="font-size:11px;color:var(--tx2);font-weight:400">(단위: 백만원)</span></span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">

        <tbody id="bgB"></tbody>
      </table>
    </div>
  </div>`;

  function renderStatBoxes(){
    const{tA,tS,tS25,rate,execLabel,rem3Label,remVal}=getDisplay();
    document.getElementById('bgMoVal').textContent=selMonth||'전체';
    document.getElementById('bgAnnV').textContent=tA.toLocaleString(undefined,{maximumFractionDigits:0});
    document.getElementById('bgExecL').textContent=execLabel;
    document.getElementById('bgExecV').textContent=Math.round(tS).toLocaleString();
    const{tS:_tS2,tS25:_tS25_2,rate:_rate2,execLabel:_eL}=getDisplay();
    const execExtra=(viewMode==='mon'&&selMonth&&_tS25_2>0)?
      ' (증감률 '+Math.round((_tS2-_tS25_2)/_tS25_2*100)+'%)':
      ' (집행률 '+Math.round(parseFloat(_rate2))+'%)';
    document.getElementById('bgExecS').textContent='백만원'+execExtra;
    // 우측 박스: rem3Label에 따라 다르게
    const r3l=document.getElementById('bgRem3L'),r3v=document.getElementById('bgRemV'),r3u=document.getElementById('bgRemUnit');
    if(r3l)r3l.textContent=rem3Label;
    if(r3v)r3v.textContent=Math.round(remVal||0).toLocaleString();

    document.getElementById('bgExecS').style.color='var(--grn)';
    if(r3u)r3u.style.color='var(--yel)';
  }

  function mv(r,mo){return(r.monthly&&r.monthly[mo])||{v26:null,v25:null};}
  function calcGrowth(v26,v25){const a=parseFloat(v26),b=parseFloat(v25);if(isNaN(a)||isNaN(b)||b===0)return'-';return Math.round((a-b)/b*100)+'%';}

  function renderHead(){
    document.getElementById('bgExecL').textContent=(viewMode==='mon'&&selMonth)?"'26 당월 집행":"'26 집행 누계";
    const isDaewol=viewMode==='mon'&&selMonth;
    const ths='background:var(--sf2);border-bottom:1px solid var(--bd);';
    const thBase=`style="${ths}padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)"`;
    const thL=`style="${ths}text-align:left;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)"`;
    document.getElementById('bgHead').innerHTML=isDaewol
      ?`<th ${thL}>구분</th><th ${thL}>매체명</th><th class="amt" ${thBase}>'26 연간</th><th class="amt" ${thBase}>'25 연간</th><th class="amt" ${thBase}>'26 당월</th><th style="${ths}min-width:60px;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">증감률</th><th class="amt" ${thBase}>'25 당월</th>`
      :(selMonth?`<th style="${ths}text-align:left;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">구분</th><th style="${ths}text-align:left;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">매체명</th><th class="amt" style="${ths}padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">'26 연간</th><th class="amt" style="${ths}padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">'25 연간</th><th class="amt" style="${ths}padding:7px 20px 7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">'26 누계</th><th style="${ths}min-width:70px;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">집행률</th><th class="amt" style="${ths}padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">'25 누계</th>`:`<th style="${ths}text-align:left;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">구분</th><th style="${ths}text-align:left;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">매체명</th><th class="amt" style="${ths}padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">'26 연간</th><th class="amt" style="${ths}padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">'25 연간</th><th class="amt" style="${ths}padding:7px 20px 7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">'26 집행(누계)</th><th style="${ths}min-width:70px;padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">집행률</th><th class="amt" style="${ths}padding:7px 10px;font-weight:700;font-size:10px;color:var(--tx2)">'25 집행(누계)</th>`);
  }

  function rowCols(r){
    if(selMonth){
      if(viewMode==='mon'){
        // 당월: 해당 월만
        const m=mv(r,selMonth);
        return`<td class="amt">${fNI(r.a26)}</td><td class="amt" style="color:var(--tx2)">${fNI(r.a25)}</td><td class="amt">${fND(m.v26)}</td><td style="min-width:60px">${calcGrowth(m.v26,m.v25)}</td><td class="amt" style="color:var(--tx2)">${fND(m.v25)}</td>`;
      } else {
        // 누계: 1월~선택월 합산
        const cs=cumSum(r,selMonth);
        const rate2=parseFloat(r.a26)>0&&cs.v26!=null?Math.round(cs.v26/r.a26*100)+'%':'-';
        return`<td class="amt">${fNI(r.a26)}</td><td class="amt" style="color:var(--tx2)">${fNI(r.a25)}</td><td class="amt" style="padding-right:20px">${fND(cs.v26)}</td><td style="min-width:70px">${rate2}</td><td class="amt" style="color:var(--tx2)">${fND(cs.v25)}</td>`;
      }
    }
    return`<td class="amt">${fNI(r.a26)}</td><td class="amt" style="color:var(--tx2)">${fNI(r.a25)}</td><td class="amt" style="padding-right:20px">${fND(r.s26)}</td><td style="min-width:70px">${fR(r.rate)}</td><td class="amt" style="color:var(--tx2)">${fND(r.s25)}</td>`;
  }

  function renderBody(){
    const tf=getTypes&&getTypes();
    const nf=getNames&&getNames();
    let d=rows;
    if(tf||nf){
      d=rows.filter(r=>{
        if(r.isTotal||r.isSub)return true;
        if(tf&&!tf.includes(r.type))return false;
        if(nf&&r.name&&!nf.includes(r.name))return false;
        return true;
      });
    }
    const isDaewol=viewMode==='mon'&&selMonth;
    const tx2s='style="color:var(--tx2)"';
    let tbody='';
    // 현재 그룹 추적
    let curGrp=null;
    d.forEach(r=>{
      if(r.isTotal){
        const m=isDaewol?mv(r,selMonth):{};
        const tc=selMonth?(viewMode==='mon'
          ?`<td class="amt" style="color:var(--ac)">${fNI(r.a26)}</td><td class="amt" ${tx2s}>${fNI(r.a25)}</td><td class="amt" style="color:var(--ac)">${fND(m.v26)}</td><td style="color:var(--ac);min-width:60px">${calcGrowth(m.v26,m.v25)}</td><td class="amt" ${tx2s}>${fND(m.v25)}</td>`
          :(()=>{const cs2=cumSum(r,selMonth);const rt2=parseFloat(r.a26)>0&&cs2.v26!=null?Math.round(cs2.v26/r.a26*100)+'%':'-';return`<td class="amt" style="color:var(--ac)">${fNI(r.a26)}</td><td class="amt" ${tx2s}>${fNI(r.a25)}</td><td class="amt" style="color:var(--ac);padding-right:20px">${fND(cs2.v26)}</td><td style="color:var(--ac)">${rt2}</td><td class="amt" ${tx2s}>${fND(cs2.v25)}</td>`})())
          :`<td class="amt" style="color:var(--ac)">${fNI(r.a26)}</td><td class="amt" ${tx2s}>${fNI(r.a25)}</td><td class="amt" style="color:var(--ac);padding-right:20px">${fND(r.s26)}</td><td style="color:var(--ac)">${fR(r.rate)}</td><td class="amt" ${tx2s}>${fND(r.s25)}</td>`;
        tbody+=`<tr style="font-weight:800;background:rgba(91,141,249,.08);border-top:2px solid var(--ac)"><td colspan="2" style="font-size:13px;color:var(--ac)">합계</td>${tc}</tr>`;
      } else if(r.isSub){
        // isSub = 계 행: grpType 추출 ("일간지 계" → "일간지")
        const grpName=r.type.replace(/\s*계$/, '').trim();
        const open=groupOpen[grpName]!==false;
        const m=isDaewol?mv(r,selMonth):{};
        const sc=selMonth?(viewMode==='mon'
          ?`<td class="amt" style="font-weight:700">${fNI(r.a26)}</td><td class="amt" ${tx2s}>${fNI(r.a25)}</td><td class="amt" style="font-weight:700">${fND(m.v26)}</td><td style="font-weight:700;min-width:60px">${calcGrowth(m.v26,m.v25)}</td><td class="amt" ${tx2s}>${fND(m.v25)}</td>`
          :(()=>{const cs3=cumSum(r,selMonth);const rt3=parseFloat(r.a26)>0&&cs3.v26!=null?Math.round(cs3.v26/r.a26*100)+'%':'-';return`<td class="amt" style="font-weight:700">${fNI(r.a26)}</td><td class="amt" ${tx2s}>${fNI(r.a25)}</td><td class="amt" style="font-weight:700;padding-right:20px">${fND(cs3.v26)}</td><td style="font-weight:700">${rt3}</td><td class="amt" ${tx2s}>${fND(cs3.v25)}</td>`})())
          :`<td class="amt" style="font-weight:700">${fNI(r.a26)}</td><td class="amt" ${tx2s}>${fNI(r.a25)}</td><td class="amt" style="font-weight:700;padding-right:20px">${fND(r.s26)}</td><td style="font-weight:700">${fR(r.rate)}</td><td class="amt" ${tx2s}>${fND(r.s25)}</td>`;
        const chevron=open
          ?'<span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:3px;background:rgba(234,179,8,.2);color:var(--yel);font-size:11px;font-weight:700;margin-right:5px;vertical-align:-2px;line-height:1">−</span>'

        tbody+=`<tr style="background:rgba(167,139,250,.04)"><td style="font-weight:600;font-size:11px;color:var(--pur)">${e(r.type)}</td><td style="font-weight:600">${e(r.name)||''}</td>${rowCols(r)}</tr>`;

      }
    });
    document.getElementById('bgB').innerHTML=tbody;
  }

  // 월선택 드롭다운

  getTypes=makeMultiDrop('bgTypeW','구분',['전체',...typeList],render);

  // 매체명 multiselect + 검색
  (function(){

    wrap.innerHTML='<div style="position:relative;display:inline-block" id="bgNm_w"><button style="'+SST+';min-width:120px;text-align:left" id="bgNm_btn">매체명 전체</button><div id="bgNm_dd" style="display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:0;z-index:50;width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4);flex-direction:column"></div></div>';

      lh+='</div>';

(function(){

  </div>
  <div id="ccCal"></div>`;

  function render(){
    const mo=+document.getElementById('ccMo').value;
    const moItems=cc.filter(x=>parseInt(x.month)===mo);
    const y=2026,fd=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate();
    const eMap={};
    moItems.forEach(x=>{
      const mt=String(x.date).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if(mt){const d=+mt[3];if(!eMap[d])eMap[d]=[];eMap[d]=eMap[d].concat(x.events)}
      else{const n=parseFloat(x.date);if(!isNaN(n)&&n>0&&n<=31){if(!eMap[n])eMap[n]=[];eMap[n]=eMap[n].concat(x.events)}}
    });
    let g=['일','월','화','수','목','금','토'].map(d=>`<div class="cal-h">${d}</div>`).join('');
    for(let i=0;i<fd;i++)g+='<div class="cal-c empty"></div>';
    for(let d=1;d<=dim;d++){
      const isT=d===now.getDate()&&mo===now.getMonth()+1;
      const evts=eMap[d]||[];
      g+=`<div class="cal-c${isT?' today':''}"><div class="cal-dt" style="font-size:12px">${d}</div>${evts.map(ev=>`<div style="font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;background:rgba(99,102,241,.15);color:#818cf8;border-left:3px solid rgba(99,102,241,.8);font-weight:500">${e(ev)}</div>`).join('')}</div>`;
    }
    document.getElementById('ccCal').innerHTML=`<div class="cd"><div class="cd-h">📒 ${mo}월 전사일정</div><div class="cd-b"><div class="cal-g">${g}</div></div></div>`;
  }
  render();
  document.getElementById('ccMo').addEventListener('change',render);
})();



// ============================================================
//  🔄 Google Sheets 실시간 동기화 (Apps Script API)

// ============================================================
(function(){
  var API='https://script.google.com/macros/s/AKfycbyiIOFW1zvlpyas5JlTbYZ8lZWormmDvmhF5pyaxmWmXatm_4SFwPyFyM1kR84pdvcn/exec';
  var AUTO_MS=5*60*1000;
  var st=document.getElementById('liveS');

  function s(v){return v==null?'':String(v).trim()}
  function n(v){var x=parseFloat(v);return isNaN(x)?null:x}

  // Find sheet by name keyword - returns values array (handles both old 2D and new {values,backgrounds} format)
  function findSheet(data,kw){
    for(var name in data){
      if(name.indexOf(kw)>=0){
        var sh=data[name];
        if(sh&&sh.values)return sh.values;
        if(Array.isArray(sh))return sh;
        return null;
      }
    }
    return null;
  }

  // Find sheet with backgrounds+fontLines - returns {values, backgrounds, fontLines} or null
  function findSheetRaw(data,kw){
    for(var name in data){
      if(name.indexOf(kw)>=0){
        var sh=data[name];
        console.log('  📋 findSheetRaw matched "'+name+'" for kw="'+kw+'"');
        if(sh&&sh.values){
          console.log('    new format, bgs:',sh.backgrounds?'yes':'no','fontLines:',sh.fontLines?'yes':'no');
          return {values:sh.values,backgrounds:sh.backgrounds||null,fontLines:sh.fontLines||null};
        }
        if(Array.isArray(sh)){
          console.log('    old format (2D array)');
          return {values:sh,backgrounds:null,fontLines:null};
        }
        return null;
      }
    }
    console.warn('  ⚠️ findSheetRaw NO MATCH for kw="'+kw+'", available:',Object.keys(data));
    return null;
  }

  // ---- Parsers (data is 2D array from Apps Script) ----
  function pToday(rows,fontLines){
    if(!rows||rows.length<2)return;
    console.log('📊 TODAY raw rows:',rows.length);
    // Debug: dump first 35 rows to understand structure
    for(var dd=0;dd<Math.min(35,rows.length);dd++){
      var dr=rows[dd];if(!dr)continue;
      var dump=[];
      for(var dc=0;dc<Math.min(14,dr.length);dc++)if(s(dr[dc]))dump.push(dc+':'+s(dr[dc]).substring(0,30));
      if(dump.length)console.log('  r'+dd+': '+dump.join(' | '));
    }

    var tasks=[],imp=[],notices=[],news=[];
    var taskMode=false,noticeMode=false,newsMode=false;
    var cl=null,ci=[];

    // First scan: find section header row indices
    var taskStart=-1,impStart=-1,noticeStart=-1,artStart=-1,newsStart=-1;
    for(var i=0;i<rows.length;i++){
      var r=rows[i];if(!r)continue;
      var b=s(r[1]),iCol=s(r[8]);
      if(b.indexOf('TODAY 주요 업무')>=0)taskStart=i;
      else if(iCol.indexOf('중요 업무')>=0||iCol.indexOf('진행 상황')>=0)impStart=i;
      else if(b.indexOf('주요 공유사항')>=0)noticeStart=i;
      else if(iCol.indexOf('기획 기사')>=0||iCol.indexOf('인벤토리')>=0)artStart=i;
      else if(b.indexOf('TODAY 코스맥스')>=0||b.indexOf('주요 뉴스')>=0)newsStart=i;
    }
    console.log('📊 Sections: task='+taskStart+' imp='+impStart+' notice='+noticeStart+' art='+artStart+' news='+newsStart);

    // Parse 주요 업무 일정: B~G columns, starts 2 rows after header (skip "구분" row)
    if(taskStart>=0){
      for(var i=taskStart+2;i<Math.min(rows.length,taskStart+15);i++){
        var r=rows[i];if(!r)continue;
        var b=s(r[1]);
        if(!b||b.indexOf('TODAY')>=0||b.indexOf('주요 공유')>=0)break;
        if(s(r[1])||s(r[2])||s(r[3]))tasks.push({category:b,media:s(r[2]),content:s(r[3]),person:s(r[4]),deadline:s(r[5]),status:s(r[6])});
      }
    }

    // Parse 중요 업무: I~N columns - 좌측 주요업무와 같은 행에 배치되어 있음
    // impStart가 있으면 거기부터, 없으면 taskStart 기준으로 같은 행들을 읽음
    var impReadStart=impStart>=0?impStart+2:(taskStart>=0?taskStart+2:-1);
    if(impReadStart>=0){
      for(var i=impReadStart;i<Math.min(rows.length,impReadStart+15);i++){
        var r=rows[i];if(!r)continue;
        var iv=s(r[8]);
        // Stop when we hit next section
        if(iv.indexOf('기획 기사')>=0||iv.indexOf('인벤토리')>=0)break;
        if(s(r[1]).indexOf('주요 공유')>=0)break;
        // Accept row if any important column has data
        if(iv&&iv!=='구분'&&(s(r[9])||s(r[10]))){
          imp.push({category:iv,media:s(r[9]),content:s(r[10]),person:s(r[11]),deadline:s(r[12]),status:s(r[13])});
        }
      }
    }

    // Parse 주요 공유사항: B column, starts 1 row after header
    if(noticeStart>=0){
      for(var i=noticeStart+1;i<Math.min(rows.length,noticeStart+20);i++){
        var r=rows[i];if(!r)continue;
        var b=s(r[1]);
        if(b.indexOf('TODAY')>=0)break;
        if(b.indexOf('[')==0){
          if(cl)notices.push({label:cl,items:ci.slice()});
          cl=b.replace(/[\[\]]/g,'');ci=[];
        }else if(b&&cl){
          ci.push(b);
        }
      }
      if(cl)notices.push({label:cl,items:ci});
    }

    // Parse 기획 기사 인벤토리: I=내용, M=전달매체, starts 2 rows after header
    var articles=[];
    if(artStart>=0){
      for(var i=artStart+2;i<Math.min(rows.length,artStart+25);i++){
        var r=rows[i];if(!r)continue;
        var content=s(r[8]);
        if(!content||content.indexOf('TODAY')>=0)break;
        // fontLines[row][col===8]: 'line-through' → 취소선 = 완료 처리된 항목
        var fl=fontLines&&fontLines[i]?fontLines[i][8]:'';
        var strikethrough=(fl==='line-through'||fl==='LINE_THROUGH');
        // 전달매체: N열(13) 또는 M열(12) 탐색
        var media=s(r[13])||s(r[12])||'미정';
        articles.push({content:content,media:media,strikethrough:strikethrough});
      }
    }

    // Parse 뉴스: B=언론사, C=제목, D=키워드
    if(newsStart>=0){
      for(var i=newsStart+2;i<rows.length;i++){
        var r=rows[i];if(!r)continue;
        var b=s(r[1]),c=s(r[2]);
        if(b&&c)news.push({media:b,title:c,keyword:s(r[3])});
      }
    }

    if(tasks.length)D.today_tasks=tasks;
    if(imp.length)D.today_important=imp;
    if(notices.length)D.notices=notices;
    if(news.length)D.today_news=news;
    if(articles.length)D.articles_inventory=articles;
    // Also set window._notices for cross-tab access (will be overwritten on reload from D)
    if(notices.length)window._notices=notices;

    console.log('📊 TODAY parsed: tasks='+tasks.length+' imp='+imp.length+' notices='+notices.length+' articles='+articles.length+' news='+news.length);
  }

  function pTasks(rows){
    if(!rows)return[];var items=[];
    // Find header row (contains "구분" or "매체") to determine actual column offsets
    var hdrRow=-1, colOff=2; // default: A,B empty, C=구분 means start at col 2
    for(var i=0;i<Math.min(5,rows.length);i++){
      var r=rows[i];if(!r)continue;
      for(var c=0;c<r.length;c++){
        if(s(r[c])==='구분'){hdrRow=i;colOff=c;break}
      }
      if(hdrRow>=0)break;
    }
    if(hdrRow<0){hdrRow=0;colOff=2}
    console.log('  pTasks: hdrRow='+hdrRow+' colOff='+colOff);
    // Data starts after header. Columns from colOff: 구분,매체,내용,중요도,종료일,담당자,상태,진행현황,비고
    for(var i=hdrRow+1;i<rows.length;i++){
      var r=rows[i];if(!r)continue;
      var no=s(r[0])||s(r[1])||''; // 순번 might be in A or B
      var cat=s(r[colOff]);
      if(!cat&&!s(r[colOff+1])&&!s(r[colOff+2]))continue;
      items.push({
        no:no,
        category:cat,
        media:s(r[colOff+1]),
        content:s(r[colOff+2]),
        priority:s(r[colOff+3]),
        deadline:s(r[colOff+4]),
        person:s(r[colOff+5]),
        status:s(r[colOff+6]),
        progress:s(r[colOff+7]),
        note:s(r[colOff+8])
      });
    }
    return items;
  }

  function pTeamCal(rows){
    if(!rows)return[];var ev=[];
    console.log('  pTeamCal: '+rows.length+' rows');
    // Calendar layout: alternating date row + event row
    // Dates can be in any column 0+, look for cells with date pattern
    for(var i=0;i<rows.length-1;i++){
      var dr=rows[i];if(!dr)continue;
      // Check if this row has dates
      var hasDate=false;
      for(var c=0;c<dr.length;c++){
        var v=s(dr[c]);
        if(v&&/\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}|\d{4}\.\s*\d{1,2}\.\s*\d{1,2}/.test(v)){hasDate=true;break}
      }
      if(!hasDate)continue;
      var er=rows[i+1];if(!er)continue;
      // Pair dates with events
      for(var c=0;c<dr.length;c++){
        var dv=s(dr[c]),evv=s(er[c]);
        if(dv&&evv&&/\d/.test(dv))ev.push({date:nD(dv),events:evv});
      }
      i++; // skip event row
    }
    console.log('  pTeamCal parsed: '+ev.length+' events');
    return ev;
  }

  function pSchedUp(rows){
    if(!rows)return[];var ev=[];
    for(var i=1;i<rows.length;i++){var r=rows[i];if(!r)continue;
      var mo=s(r[0]),day=s(r[1]),ct=s(r[2]);
      if(mo&&day&&ct)ev.push({month:mo,day:day,content:ct,dayOfWeek:n(r[3])});
    }return ev;
  }

  function pClipping(rows){
    if(!rows)return[];var items=[];
    for(var i=1;i<rows.length;i++){var r=rows[i];if(!r||!s(r[0]))continue;
      items.push({date:s(r[0]),keyword:s(r[1]),media:s(r[2]),title:s(r[3]),link:s(r[4])});
    }return items;
  }

  function pBudget(rows){
    if(!rows)return[];var items=[];
    // 헤더에서 월별 컬럼 위치 파악 (col 8부터 "N월" 패턴)
    var monthCols=[];
    for(var hr=0;hr<Math.min(3,rows.length);hr++){
      var hrow=rows[hr]||[];
      for(var c=7;c<hrow.length;c++){
        var mc=s(hrow[c]).match(/^(\d{1,2})월$/);
        if(mc){monthCols.push({month:mc[1]+'월',col26:c,col25:c+1});c++;}
      }
      if(monthCols.length>0)break;
    }
    for(var i=2;i<rows.length;i++){var r=rows[i];if(!r||!s(r[1]))continue;
      var type=s(r[1]),name=s(r[2]);
      var monthly={};
      monthCols.forEach(function(m){monthly[m.month]={v26:n(r[m.col26]),v25:n(r[m.col25])};});
      items.push({type:type,name:name,a26:n(r[3]),a25:n(r[4]),s26:n(r[5]),rate:n(r[6]),s25:n(r[7]),
        monthly:monthly,
        isSub:type.indexOf('계')>=0,isTotal:type==='합계',isSingle:['글로벌대행','글로벌PR','예비비'].indexOf(type)>=0});
    }return items;
  }

  function pMonthly(rows){
    if(!rows)return{};
    var result={};var curMonth=null;var dataStart=false;

    for(var i=0;i<rows.length;i++){
      var r=rows[i];if(!r)continue;

      // 헤더 감지: 행 전체에서 "X월 현황" 또는 "X월" 패턴 탐색
      var rowFull='';for(var c=0;c<r.length;c++)rowFull+=s(r[c])+' ';
      // "26년 3월 현황" 또는 "3월 현황" 또는 "26.03 현황"
      var mh=rowFull.match(/(\d{1,2})월\s*현황/)||rowFull.match(/현황.*?(\d{1,2})월/);
      if(mh){
        curMonth=mh[1]+'월';result[curMonth]=[];dataStart=false;
        console.log('  pMonthly found month:',curMonth,'at row',i);
        continue;
      }

      // 컬럼 헤더 감지: "매체" 포함
      if(curMonth&&!dataStart){
        var hasMedia=false;
        for(var c=0;c<r.length;c++){if(s(r[c])==='매체'){hasMedia=true;break;}}
        if(hasMedia){dataStart=true;continue;}
        // "매체" 없어도 다음 행에 데이터가 있으면 시작
      }

      if(!curMonth)continue;

      // 합계 행은 별도 저장
      var rowFull2='';for(var c=0;c<Math.min(r.length,3);c++)rowFull2+=s(r[c]);
      var isTot=rowFull2.indexOf('합계')>=0;

      // 데이터 행 탐색: col B(1)에 매체명이 있는 행
      // Apps Script는 배열 0-indexed: A=0, B=1, C=2, ...
      var media=s(r[1]);
      if(!media||media==='매체')continue;

      var rowObj={
        media:media,
        sub:s(r[2]),
        received:s(r[3]),
        v1:s(r[4]),
        v2:s(r[5]),
        note:s(r[6]),
        cumulative26:s(r[7]),
        monthly25:s(r[8]),
        cumulative25:s(r[9]),
        annual25:s(r[10]),
        isTotal:isTot
      };
      if(curMonth){
        if(!result[curMonth])result[curMonth]=[];
        result[curMonth].push(rowObj);
      }
    }
    console.log('pMonthly months:',Object.keys(result));
    return result;
  }


  function pYourlogo(rows){
    if(!rows||rows.length<3)return null;
    var prods=[],stock=[],usage=[];

    // ── 재고현황: "■재고현황" 행 이후, 제품명 행(날짜+제품명들) → 수치 행 ──
    var stockHeaderRow=-1;
    for(var i=0;i<Math.min(20,rows.length);i++){
      var r=rows[i];if(!r)continue;
      var rowStr='';for(var c=0;c<r.length;c++)rowStr+=s(r[c]);
      if(rowStr.indexOf('재고현황')>=0||rowStr.indexOf('재고 현황')>=0){stockHeaderRow=i;break;}
    }
    // 재고헤더 행 이후 첫 번째로 제품명(문자열)이 있는 행 = 제품 헤더 행
    var prodHeaderRow=-1,stockValRow=-1;
    for(var i=stockHeaderRow+1;i<Math.min(stockHeaderRow+8,rows.length);i++){
      var r=rows[i];if(!r)continue;
      var hasStr=false;
      for(var c=1;c<r.length;c++){var v=s(r[c]);if(v&&isNaN(parseFloat(v))&&v.length>2&&!v.match(/^\d{4}/)){hasStr=true;break;}}
      if(hasStr&&prodHeaderRow<0){prodHeaderRow=i;continue;}
      if(prodHeaderRow>=0&&stockValRow<0){
        // 수치가 있으면 stock 행
        var hasNum=false;for(var c=1;c<r.length;c++){if(s(r[c])&&!isNaN(parseFloat(r[c]))){hasNum=true;break;}}
        if(hasNum){stockValRow=i;break;}
      }
    }
    if(prodHeaderRow>=0){
      var hr=rows[prodHeaderRow];
      // 제품명은 날짜 이후 컬럼부터 (날짜는 YYYY로 시작)
      var prodStart=1;
      for(var c=1;c<hr.length;c++){
        var v=s(hr[c]);
        if(v&&isNaN(parseFloat(v))&&!v.match(/^\d{4}/)){prodStart=c;break;}
      }
      for(var c=prodStart;c<hr.length;c++){var v=s(hr[c]);if(v&&v!=='사용처'&&v!=='비고')prods.push(v);}
    }
    if(stockValRow>=0&&prods.length>0){
      var sr=rows[stockValRow];
      // 재고값: prodStart 컬럼부터
      var hr=rows[prodHeaderRow];
      var prodStart=1;
      for(var c=1;c<hr.length;c++){var v=s(hr[c]);if(v&&isNaN(parseFloat(v))&&!v.match(/^\d{4}/)){prodStart=c;break;}}
      for(var c=prodStart;c<prodStart+prods.length;c++){stock.push(s(sr[c]));}
    }

    // ── 사용내역: "■사용내역" 또는 "구분" 헤더 행 찾기 ──
    var usageHeaderRow=-1;
    for(var i=0;i<rows.length;i++){
      var r=rows[i];if(!r)continue;
      var rowStr='';for(var c=0;c<r.length;c++)rowStr+=s(r[c]);
      if(rowStr.indexOf('사용내역')>=0||rowStr.indexOf('사용 내역')>=0){usageHeaderRow=i;continue;}
      // 구분|일자 헤더 행
      for(var c=0;c<Math.min(r.length,4);c++){
        if(s(r[c])==='구분'&&(s(r[c+1])==='일자'||s(r[c+2])==='일자')){
          usageHeaderRow=i;break;
        }
      }
      if(usageHeaderRow>=0&&i>usageHeaderRow)break;
    }
    var usageDataStart=usageHeaderRow>=0?usageHeaderRow+1:stockValRow+3;
    // 제품 컬럼 시작 위치 (사용내역 헤더 기준)
    var uProdStart=2;  // 기본값: col C(2)
    if(usageHeaderRow>=0){
      var uhr=rows[usageHeaderRow]||[];
      for(var c=0;c<uhr.length;c++){
        if(prods.length>0&&s(uhr[c])===prods[0]){uProdStart=c;break;}
        // "일자" 컬럼 이후
        if(s(uhr[c])==='일자'){uProdStart=c+1;break;}
      }
    }
    // 구분 컬럼 (일자 바로 앞)
    var uTypStart=uProdStart-2>=0?uProdStart-2:0;
    var uDtStart=uProdStart-1>=0?uProdStart-1:1;

    for(var i=usageDataStart;i<rows.length;i++){
      var r2=rows[i];if(!r2)continue;
      var dt=s(r2[uDtStart]);
      if(!dt||dt==='일자')continue;  // 빈 행 또는 헤더 스킵
      var typ=s(r2[uTypStart])||'반출';
      var u={type:typ,date:dt,note:s(r2[uProdStart+prods.length])};
      for(var c=0;c<prods.length;c++){u['p'+(c+1)]=s(r2[uProdStart+c]);}
      usage.push(u);
    }
    console.log('pYourlogo: prods='+prods.length+' stock='+stock.length+' usage='+usage.length);
    return{products:prods,stock:stock,usage:usage};
  }

  function pPR(rows){
    if(!rows||rows.length<2)return[];
    var items=[];
    console.log('pPR input:',rows.length,'rows');

    // 1단계: 헤더 행 탐색 — "순번" 또는 "번호" 키워드로 위치 찾기
    var dataStart=0, cNo=-1, cMon=-1, cTyp=-1, cDt=-1, cCont=-1, cMed=-1, cLnk=-1;
    for(var i=0;i<Math.min(30,rows.length);i++){
      var r=rows[i];if(!r)continue;
      for(var c=0;c<r.length;c++){
        var v=s(r[c]);
        // 순번 또는 번호 컬럼 감지
        if(v==='순번'||v==='번호'||v==='No.'||v==='NO'){
          cNo=c; cMon=c+1; cTyp=c+2; cDt=c+3; cCont=c+4; cMed=c+5; cLnk=c+6;
          dataStart=i+1;
          console.log('pPR 헤더 발견: row',i,'col',c,'keyword='+v);
          break;
        }
        // 배포월 컬럼 감지 (헤더에 "배포월" 있는 경우)
        if(v==='배포월'||v==='월'){
          cMon=c; cNo=c-1; cTyp=c+1; cDt=c+2; cCont=c+3; cMed=c+4; cLnk=c+5;
          dataStart=i+1;
          console.log('pPR 헤더(배포월) 발견: row',i,'col',c);
          break;
        }
      }
      if(dataStart>0)break;
    }

    // 2단계: 헤더 못 찾으면 — 모든 컬럼 순회하며 "N월" + 유형 패턴 찾기
    if(dataStart===0){
      console.log('pPR 헤더 없음 → 데이터 행 직접 탐색');
      for(var i=0;i<Math.min(50,rows.length);i++){
        var r=rows[i];if(!r)continue;
        for(var c=0;c<r.length;c++){
          var v=s(r[c]);
          // "N월" 형식 + 다음 컬럼에 유형 키워드
          if(v.match(/^\d{1,2}월$/)&&s(r[c+1])&&s(r[c+1]).length>2){
            cMon=c; cNo=Math.max(0,c-1); cTyp=c+1; cDt=c+2; cCont=c+3; cMed=c+4; cLnk=c+5;
            dataStart=i;
            console.log('pPR 데이터 직접 발견: row',i,'col',c,'month='+v);
            break;
          }
        }
        if(dataStart>0)break;
      }
    }

    // 3단계: 그래도 못 찾으면 — 전체 행 스캔 (완전 fallback)
    if(dataStart===0){
      console.log('pPR 완전 fallback — 전체 스캔');
      dataStart=1;
      // 기본 컬럼 위치 추정: 첫 번째 "N월" 값이 있는 컬럼
      for(var i=0;i<Math.min(100,rows.length);i++){
        var r=rows[i];if(!r)continue;
        for(var c=0;c<r.length;c++){
          if(s(r[c]).match(/^\d{1,2}월$/)){
            cMon=c;cNo=Math.max(0,c-1);cTyp=c+1;cDt=c+2;cCont=c+3;cMed=c+4;cLnk=c+5;
            dataStart=i;
            console.log('pPR fallback: row',i,'col',c);
            break;
          }
        }
        if(cMon>=0)break;
      }
    }

    console.log('pPR 컬럼 맵: no='+cNo+' mon='+cMon+' typ='+cTyp+' dt='+cDt+' cont='+cCont+' med='+cMed+' lnk='+cLnk+' start='+dataStart);

    if(cMon<0){console.warn('pPR: 컬럼 위치를 찾지 못함');return[];}

    // 4단계: 데이터 파싱
    var skipKeywords=['배포월','순번','번호','유형','내용','매체','합계','소계','누계','COUNTA'];
    for(var i=dataStart;i<rows.length;i++){
      var r=rows[i];if(!r)continue;
      var mon=s(r[cMon]);
      if(!mon||!mon.match(/^\d{1,2}월$/))continue;
      var typ=s(r[cTyp]),dt=s(r[cDt]),cont=s(r[cCont]),med=s(r[cMed]),lnk=s(r[cLnk]);

      // 헤더/요약 행 스킵
      var skip=false;
      for(var k=0;k<skipKeywords.length;k++){
        if(typ===skipKeywords[k]||cont===skipKeywords[k]||mon===skipKeywords[k]){skip=true;break;}
      }
      if(skip)continue;

      // 의미 있는 데이터 행: 유형 또는 내용 또는 매체 中 하나라도 실질적 텍스트
      var hasReal=(typ&&typ.length>1&&isNaN(parseFloat(typ)))||(cont&&cont.length>2&&isNaN(parseFloat(cont)))||(med&&med.length>1&&isNaN(parseFloat(med)));
      if(!hasReal)continue;

      items.push({no:s(r[cNo]),month:mon,type:typ,date:dt,content:cont,media:med,link:lnk});
    }

    console.log('pPR 최종 결과:',items.length,'건');
    if(items.length>0)console.log('  첫 행 샘플:',items[0].month,items[0].type,items[0].content&&items[0].content.substring(0,20));
    return items;
  }


  function pComCal(rows){
    if(!rows||rows.length<2)return[];
    var items=[];
    var curYear=2026,curMonth=null;

    // 구글시트 전사일정 캘린더 구조:
    // - "2026.04" 셀이 있는 행 → 년월
    // - "일","월","화","수","목","금","토" 가 있는 행 → 요일 헤더, 컬럼 위치 기록
    // - 숫자(1~31)가 있는 행 → 날짜 행
    // - 텍스트가 있는 행 → 해당 날짜의 이벤트

    var dayColMap={};  // dow(0=일)→colIdx
    var currentDates={};  // colIdx→dateNum (현재 주의 날짜)

    for(var i=0;i<rows.length;i++){
      var r=rows[i];if(!r)continue;

      // 년월 감지: 셀에 "2026.04" 또는 "2026" + "4" 형식
      var ymFound=false;
      for(var c=0;c<r.length;c++){
        var v=s(r[c]);
        var ym=v.match(/^(\d{4})[.년\s]*(\d{1,2})[.월]?$/);
        if(ym){curYear=+ym[1];curMonth=+ym[2];dayColMap={};currentDates={};ymFound=true;break;}
        // "2026" 만 있고 다음 셀에 "4" 등 숫자인 경우
        if(v==='2026'&&r[c+1]){var mv=parseInt(s(r[c+1]));if(!isNaN(mv)&&mv>=1&&mv<=12){curYear=2026;curMonth=mv;dayColMap={};currentDates={};ymFound=true;break;}}
      }
      if(ymFound)continue;

      // 요일 헤더 행 감지
      var dowCols=['일','월','화','수','목','금','토'];
      var foundDow=0;var tmpMap={};
      for(var c=0;c<r.length;c++){
        var idx2=dowCols.indexOf(s(r[c]));
        if(idx2>=0){tmpMap[idx2]=c;foundDow++;}
      }
      if(foundDow>=5){dayColMap=tmpMap;currentDates={};continue;}

      if(!curMonth||Object.keys(dayColMap).length<5)continue;

      // 날짜 행 감지: 요일 컬럼들 중 2개 이상에 숫자(1~31)
      var tmpDates={};var dtCount=0;
      for(var dow=0;dow<7;dow++){
        var col=dayColMap[dow];if(col===undefined)continue;
        var v=s(r[col]);var n=parseInt(v);
        if(!isNaN(n)&&n>=1&&n<=31&&v.trim()===String(n)){tmpDates[col]=n;dtCount++;}
      }
      if(dtCount>=2){currentDates=tmpDates;continue;}

      // 이벤트 행: 현재 날짜 맵이 있을 때 각 컬럼의 텍스트 수집
      if(Object.keys(currentDates).length>0){
        for(var dow=0;dow<7;dow++){
          var col=dayColMap[dow];if(col===undefined||currentDates[col]===undefined)continue;
          // 셀에 텍스트 있으면 이벤트
          var cellText=s(r[col]);
          if(cellText){
            var dateStr=curYear+'-'+String(curMonth).padStart(2,'0')+'-'+String(currentDates[col]).padStart(2,'0');
            var ex=items.find(function(it){return it.date===dateStr;});
            if(ex){ex.events.push(cellText);}
            else{items.push({month:String(curMonth),date:dateStr,events:[cellText]});}
          }
        }
      }
    }
    console.log('pComCal parsed:',items.length,'events');
    return items;
  }


  // 외근현황 파서
  // Apps Script가 {values: [[...]], backgrounds: [[...]]} 형식으로 반환하는 경우 지원
  // 기존 2D 배열 형식도 호환
  function pOuting(sheetData){
    if(!sheetData)return null;

    // Detect format: new (object with values/backgrounds) or legacy (2D array)
    var rows, bgs=null;
    if(Array.isArray(sheetData)){
      rows=sheetData;
    }else if(sheetData.values){
      rows=sheetData.values;
      bgs=sheetData.backgrounds||null;
    }else{
      return null;
    }

    if(!rows||rows.length<3)return null;
    console.log('📊 외근현황 raw rows:',rows.length,'bgs:',bgs?'yes':'no');
    for(var dd=0;dd<Math.min(5,rows.length);dd++){
      var dr=rows[dd];if(!dr)continue;
      var dump=[];
      for(var dc=0;dc<Math.min(12,dr.length);dc++)if(s(dr[dc]))dump.push(dc+':'+s(dr[dc]).substring(0,20));
      if(dump.length)console.log('  out r'+dd+': '+dump.join(' | '));
    }

    // Time parser: extract HH:MM from various formats
    function parseTime(v){
      if(!v)return'';
      var str=String(v).trim();
      if(!str||str==='-')return str;
      // Sheets epoch ISO: 1899-12-30T23:32:08.000Z (UTC) → KST = UTC + 9
      // Use Date object to parse and get LOCAL time (browser will apply timezone)
      if(/^1899-/.test(str)){ // Sheets epoch: 부동소수점 오류(8:32:08) → floor로 정각 처리
        var d=new Date(str);
        if(!isNaN(d.getTime())){
          var utcH=d.getUTCHours(),utcM=d.getUTCMinutes();
          var totalMin=utcH*60+utcM+9*60;
          // floor: 항상 내림 → 8:32 → 8:00, 9:32 → 9:00
          var floored=Math.floor(totalMin/60)*60;
          var h=Math.floor(floored/60)%24,mi=floored%60;
          return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
        }
      }
      // Generic ISO with T
      var m=str.match(/T(\d{2}):(\d{2})/);
      if(m)return m[1]+':'+m[2];
      m=str.match(/(\d{1,2}):(\d{2})/);
      if(m)return String(+m[1]).padStart(2,'0')+':'+m[2];
      m=str.match(/(오전|오후)\s*(\d{1,2}):?(\d{2})?/);
      if(m){
        var h=parseInt(m[2]),mi=m[3]||'00';
        if(m[1]==='오후'&&h<12)h+=12;
        if(m[1]==='오전'&&h===12)h=0;
        return String(h).padStart(2,'0')+':'+mi;
      }
      return str;
    }

    function parseDate(v){
      if(!v)return'';
      var str=String(v).trim();
      var m=str.match(/(\d{4})[-.\s]+(\d{1,2})[-.\s]+(\d{1,2})/);
      if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
      return str;
    }

    // Check if hex color is "empty" (white/transparent/default)
    function isEmptyColor(c){
      if(!c)return true;
      var h=String(c).toLowerCase();
      return h===''||h==='#ffffff'||h==='#fff'||h==='white'||h==='#000000'||h==='none';
    }

    // Row 0: B=date, D/F/H/J=member names
    var r0=rows[0]||[];
    var date=parseDate(r0[1]);
    var members=[];
    [3,5,7,9].forEach(function(idx){var m=s(r0[idx]);if(m)members.push(m)});
    if(members.length<4)members=['임영롱','이성웅','권이윤','이남정'];

    // Row 2+: data rows
    var slots=[];
    for(var i=2;i<rows.length;i++){
      var r=rows[i];if(!r)continue;
      var br=bgs?bgs[i]:null;
      var from=parseTime(r[1]),to=parseTime(r[2]);
      if(!from&&!to)continue;
      var slot={from:from,to:to};
      // Person 0: D(3)/E(4), Person 1: F(5)/G(6), Person 2: H(7)/I(8), Person 3: J(9)/K(10)
      [[0,3,4],[1,5,6],[2,7,8],[3,9,10]].forEach(function(p){
        var pi=p[0],si=p[1],li=p[2];
        slot['person'+pi+'_schedule']=s(r[si])||null;
        slot['person'+pi+'_place']=s(r[li])||null;
        // Extract background color for this person's schedule cell
        if(br){
          var sbg=br[si],lbg=br[li];
          slot['person'+pi+'_bg']=isEmptyColor(sbg)?(isEmptyColor(lbg)?null:lbg):sbg;
        }else{
          slot['person'+pi+'_bg']=null;
        }
      });
      slots.push(slot);
    }
    // 정규 슬롯 08:00~17:00(마지막은 17:00~-) 로 정규화
    const CANONICAL=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
    const normSlots=CANONICAL.map((hr,idx)=>{
      const toHr=idx<CANONICAL.length-1?CANONICAL[idx+1]:'-';
      // 파싱된 슬롯 중 from이 일치하는 것 찾기
      const found=slots.find(s=>s.from===hr);
      if(found){found.to=toHr;return found;}
      // 없으면 빈 슬롯 생성
      return{from:hr,to:toHr,
        person0_schedule:null,person0_place:null,person0_bg:null,
        person1_schedule:null,person1_place:null,person1_bg:null,
        person2_schedule:null,person2_place:null,person2_bg:null,
        person3_schedule:null,person3_place:null,person3_bg:null};
    });
    console.log('📊 외근현황 parsed:',normSlots.length,'canonical slots, date:',date,'members:',members);
    return {date:date,members:members,timeSlots:normSlots};
  }

  // ---- Main sync ----
  async function syncAll(){
    st.textContent='동기화중...';st.style.color='var(--yel)';
    try{
      console.log('🔄 Apps Script API 호출:',API);
      var resp=await fetch(API);
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      var data=await resp.json();
      var sheetNames=Object.keys(data);
      console.log('📊 수신된 시트 ('+sheetNames.length+'개):',sheetNames);

      // Apply each sheet by name matching
      var todayRaw=findSheetRaw(data,'TODAY');if(todayRaw)pToday(todayRaw.values,todayRaw.fontLines||null);
      // 외근현황: try multiple keywords
      var ot=findSheetRaw(data,'외근')||findSheetRaw(data,'외근현황')||findSheetRaw(data,'외');
      if(ot){var o=pOuting(ot);if(o){D.outing=o;console.log('  외근 saved:',o.timeSlots.length,'slots')}}
      else{console.warn('  ⚠️ 외근 시트 못 찾음')}
      var tp=findSheet(data,'업무_진행');if(tp){D.tasks_progress=pTasks(tp);console.log('  업무_진행:',D.tasks_progress.length)}
      var td=findSheet(data,'업무_완료');if(td){D.tasks_done=pTasks(td);console.log('  업무_완료:',D.tasks_done.length)}
      var tc=findSheet(data,'일정_팀');if(tc){var ev=pTeamCal(tc);if(ev.length)D.team_cal=ev}
      var su=findSheet(data,'일정_업로드');if(su){var ev=pSchedUp(su);if(ev.length)D.schedule_events=ev}
      var cl=findSheet(data,'미디어클리핑');if(cl){var c=pClipping(cl);if(c.length)D.clipping=c}
      var bg=findSheet(data,'예산현황');if(bg){var b=pBudget(bg);if(b.length)D.budget_rows=b}
      // 홍보현황: 다중 키워드 시도
      var prSh=findSheet(data,'홍보현황')||findSheet(data,'홍보')||findSheet(data,'PR목록')||findSheet(data,'보도');
      if(prSh){var p=pPR(prSh);if(p.length){D.pr_list=p;console.log('  홍보현황:',p.length)}}
      var cc=findSheet(data,'전사일정')||findSheet(data,'전사 일정')||findSheet(data,'전사');if(cc){var c=pComCal(cc);if(c.length)D.company_cal=c}
      // 유어로고
      var ylSh=findSheet(data,'유어로고')||findSheet(data,'YourLogo')||findSheet(data,'재고');
      if(ylSh){var yl=pYourlogo(ylSh);if(yl)D.yourlogo=yl;}
      // 당월현황: 월별 다중 테이블
      var moSh=findSheet(data,'당월')||findSheet(data,'당월현황');
      if(moSh){
        var moData=pMonthly(moSh);
        var moKeys=Object.keys(moData||{});
        console.log('  당월현황 파싱결과 월목록:',moKeys);
        if(moKeys.length>0){
          D.monthly_all=moData;
          var prevM=(new Date().getMonth()+1);
          var prevMS=(prevM>1?prevM-1:12)+'월';
          D.monthly=(moData[prevMS]||moData[moKeys[moKeys.length-1]]||[]);
          console.log('  당월현황 디폴트월:',prevMS,'행수:',D.monthly.length);
        }
      }

      st.textContent='LIVE';st.style.color='var(--grn)';
      st.title=sheetNames.length+' 시트 ('+new Date().toLocaleTimeString('ko')+')';

      try{
        sessionStorage.setItem('cosmax_live',JSON.stringify(D));
        sessionStorage.setItem('cosmax_live_version',CACHE_VERSION);
      }catch(e){}
      // 현재 탭 저장 후 reload
      var activeTab=document.querySelector('.tab.on');
      if(activeTab)sessionStorage.setItem('cosmax_active_tab',activeTab.textContent.trim());
      location.reload();

    }catch(e){
      console.error('❌ Sync error:',e);
      st.textContent='연결실패';st.style.color='var(--fire)';
      st.title=e.message;
    }
  }

  var rbtn=document.querySelector('.rbtn');
  if(rbtn)rbtn.onclick=function(){sessionStorage.removeItem('cosmax_live');syncAll()};
  // Check if cached data is incomplete (e.g. outing has no data) → force resync
  var needsResync=false;
  if(_cached){
    var oc=_cached.outing;
    if(!oc||!oc.timeSlots||oc.timeSlots.length===0)needsResync=true;
    // Check if any slot actually has data
    if(oc&&oc.timeSlots){
      var hasAnyData=oc.timeSlots.some(function(s){
        return s.person0_schedule||s.person1_schedule||s.person2_schedule||s.person3_schedule;
      });
      if(!hasAnyData)needsResync=true;
    }
  }
  if(!_cached||needsResync){
    if(needsResync)console.log('🔄 캐시 불완전 - 강제 재동기화');
    setTimeout(syncAll,1500);
  }
  else{st.textContent='LIVE';st.style.color='var(--grn)';st.title='캐시 데이터'}
  if(AUTO_MS>0)setInterval(function(){sessionStorage.removeItem('cosmax_live');syncAll()},AUTO_MS);
})();
</script>
</body>
</html>
